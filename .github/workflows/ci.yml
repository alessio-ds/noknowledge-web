name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # These replay Python-generated fixtures or check pure formats and crypto,
      # so they need no interpreter and no relay.
      - run: npx vitest run test/crypto.test.ts test/devices.test.ts test/history.test.ts
